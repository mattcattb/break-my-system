services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-break_my_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-break_my_system}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./systems/go-redis
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-26379}:6479"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6479"]
      interval: 10s
      timeout: 5s
      retries: 5

  wad:
    build:
      context: ./systems/wad-filesystem
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WAD_PORT:-27373}:7373"
    volumes:
      - "${WAD_DATA_DIR:-/tmp/break-my-system/wads}:/data"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7373"]
      interval: 10s
      timeout: 5s
      retries: 5


  torrent-tracker:
    image: ${TORRENT_TRACKER_IMAGE:-mattbou12/go-torrent-tracker:0.2.0}
    build:
      context: ./systems/go-torrent
      dockerfile: Dockerfile.tracker
    restart: unless-stopped
    environment:
      TRACKER_LISTEN: ":6969"
      TRACKER_STATUS_LISTEN: ":8080"
      TRACKER_INTERVAL: ${TORRENT_TRACKER_INTERVAL:-1s}
      TRACKER_TORRENT_DIR: /artifacts
    volumes:
      - ${TORRENT_ARTIFACT_DIR:-./systems/go-torrent/artifacts/lesson-payload-v1}:/artifacts:ro
    ports:
      - "${TORRENT_TRACKER_HOST_PORT:-16969}:6969"
      - "127.0.0.1:${TORRENT_TRACKER_STATUS_HOST_PORT:-18080}:8080"
    networks:
      bms-runtime:
        aliases:
          - tracker
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  torrent-seeder:
    image: ${TORRENT_CLIENT_IMAGE:-mattbou12/go-torrent:0.2.0}
    build:
      context: ./systems/go-torrent
      dockerfile: Dockerfile.torrent
    restart: unless-stopped
    command:
      - seed
      - -listen
      - :6881
      - -status-listen
      - :8080
      - -data
      - /artifacts/lesson-payload-v1.bin
      - /artifacts/lesson-payload-v1.torrent
    volumes:
      - ${TORRENT_ARTIFACT_DIR:-./systems/go-torrent/artifacts/lesson-payload-v1}:/artifacts:ro
    ports:
      - "127.0.0.1:${TORRENT_SEED_STATUS_HOST_PORT:-18081}:8080"
    networks:
      - bms-runtime
    depends_on:
      torrent-tracker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6881"]
      interval: 1s
      timeout: 1s
      retries: 10

  torrent-learner-1:
    image: ${TORRENT_CLIENT_IMAGE:-mattbou12/go-torrent:0.2.0}
    pull_policy: never
    restart: unless-stopped
    command:
      - download
      - -listen
      - :6881
      - -status-listen
      - :8080
      - -output
      - /data/lesson-payload-v1.bin
      - /artifacts/lesson-payload-v1.torrent
    volumes:
      - ${TORRENT_ARTIFACT_DIR:-./systems/go-torrent/artifacts/lesson-payload-v1}/lesson-payload-v1.torrent:/artifacts/lesson-payload-v1.torrent:ro
    ports:
      - "127.0.0.1:${TORRENT_LEARNER_1_STATUS_HOST_PORT:-18082}:8080"
    networks:
      - bms-runtime
    depends_on:
      torrent-tracker:
        condition: service_healthy
      torrent-seeder:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo '556c4f1388fd6ad7b9f5e78ed5da7eda13e7b231f0e0be99d639b7ba1b4d0b45  /data/lesson-payload-v1.bin' | sha256sum -c -",
        ]
      interval: 1s
      timeout: 1s
      retries: 20

  torrent-learner-2:
    image: ${TORRENT_CLIENT_IMAGE:-mattbou12/go-torrent:0.2.0}
    pull_policy: never
    restart: unless-stopped
    command:
      - download
      - -listen
      - :6881
      - -status-listen
      - :8080
      - -output
      - /data/lesson-payload-v1.bin
      - /artifacts/lesson-payload-v1.torrent
    volumes:
      - ${TORRENT_ARTIFACT_DIR:-./systems/go-torrent/artifacts/lesson-payload-v1}/lesson-payload-v1.torrent:/artifacts/lesson-payload-v1.torrent:ro
    ports:
      - "127.0.0.1:${TORRENT_LEARNER_2_STATUS_HOST_PORT:-18083}:8080"
    networks:
      - bms-runtime
    depends_on:
      torrent-tracker:
        condition: service_healthy
      torrent-seeder:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo '556c4f1388fd6ad7b9f5e78ed5da7eda13e7b231f0e0be99d639b7ba1b4d0b45  /data/lesson-payload-v1.bin' | sha256sum -c -",
        ]
      interval: 1s
      timeout: 1s
      retries: 20

  plc:
    build:
      context: ./systems/plc-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 7474
    ports:
      - "${PLC_PORT:-27474}:7474"

  minesweeper:
    build:
      context: ./systems/minesweeper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MINESWEEPER_MODE: server
      MINESWEEPER_PORT: 7575
      MINESWEEPER_DATA_DIR: /data
      MINESWEEPER_LEADERBOARD_PATH: ${MINESWEEPER_LEADERBOARD_PATH:-/data/leaderboard.csv}
    volumes:
      - minesweeper-data:/data
    ports:
      - "${MINESWEEPER_PORT:-27575}:7575"

volumes:
  postgres-data:
  redis-data:
  minesweeper-data:

networks:
  bms-runtime:
    name: bms-runtime
